<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧停车平台 · AI 产品经理作品集</title>
<style>
  :root{
    --purple:#7C3AED;--purple-d:#5B21B6;--purple-soft:#EDE4FF;
    --blue:#2563EB;--blue-d:#1D4ED8;--blue-soft:#E0EBFF;
    --teal:#0D9488;--teal-soft:#CCFBF1;
    --amber:#D97706;--amber-soft:#FEF3C7;
    --rose:#E11D48;--rose-soft:#FFE4E6;
    --green:#059669;--green-soft:#D1FAE5;
    --gray:#6B7280;--gray-soft:#F3F4F6;
    --ink:#1F2430;--muted:#667085;--line:#E5E7EB;--bg:#F7F7FB;--card:#FFFFFF;
    --shadow:0 6px 24px rgba(124,58,237,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .hero{background:linear-gradient(135deg,#7C3AED 0%,#5B21B6 45%,#2563EB 100%);color:#fff;padding:52px 0 46px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero .wrap{position:relative;z-index:1}
  .kicker{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:12px;font-weight:700;letter-spacing:1px;padding:5px 14px;border-radius:999px;margin-bottom:16px}
  .hero h1{font-size:34px;line-height:1.25;margin-bottom:10px;letter-spacing:-.5px}
  .hero .sub{font-size:16px;opacity:.92;max-width:760px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .legend span{font-size:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px}
  .demo-cta{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:#fff;color:var(--purple-d);font-size:14.5px;font-weight:800;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .18s,box-shadow .18s}
  .demo-cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.24)}
  .demo-cta span{font-size:11px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted);padding:13px 14px;border-bottom:2px solid transparent}
  nav a:hover{color:var(--purple);border-bottom-color:var(--purple)}
  section{padding:38px 0 6px;scroll-margin-top:56px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-no{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .sec-head h2{font-size:21px;letter-spacing:-.3px}
  .sec-head .en{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px}
  .h3{font-size:15px;font-weight:800;color:var(--purple-d);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .h3:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--purple)}
  .p{font-size:14px;color:#374151;margin-bottom:8px;word-break:break-word}
  .p:last-child{margin-bottom:0}
  .ev{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle;margin:0 1px}
  .ev-real{background:var(--green-soft);color:#047857}
  .ev-sim{background:var(--blue-soft);color:var(--blue-d)}
  .ev-est{background:var(--amber-soft);color:#B45309}
  .ev-hyp{background:var(--gray-soft);color:#4B5563}
  .tbl-wrap{overflow-x:auto;margin:6px 0 4px;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--purple-soft);color:var(--purple-d);font-weight:700;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tr:nth-child(even) td{background:#FBFAFE}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:6px 0}
  .mini{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:13px 14px;background:#fff}
  .mini.purple{border-left-color:var(--purple)} .mini.teal{border-left-color:var(--teal)}
  .mini.amber{border-left-color:var(--amber)} .mini.rose{border-left-color:var(--rose)}
  .mini .tag{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);background:var(--gray-soft);padding:2px 7px;border-radius:5px;margin-bottom:6px}
  .mini .t{font-weight:800;font-size:14px;margin-bottom:4px}
  .mini .b{font-size:12.5px;color:#4B5563}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .kv .k,.kv .v{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
  .kv .k{background:#FAFAFC;font-weight:700;color:var(--muted)}
  .kv .v{color:#374151}
  .kv .k:last-of-type,.kv .v:last-of-type{border-bottom:0}
  .callout{border-radius:10px;padding:12px 14px;font-size:13px;margin:6px 0;border-left:4px solid var(--blue);background:var(--blue-soft);color:var(--blue-d)}
  .callout.warn{border-left-color:var(--amber);background:var(--amber-soft);color:#92400E}
  .score-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0}
  .score{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .score .q{font-size:12px;color:var(--muted);font-weight:700}
  .score .v{font-size:24px;font-weight:800;color:var(--purple);margin:2px 0}
  .score .v small{font-size:12px;color:var(--muted);font-weight:600}
  .score .g{font-size:11.5px;color:#4B5563}
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  details summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:9px}
  details summary::-webkit-details-marker{display:none}
  details summary:before{content:"+";color:var(--purple);font-weight:800;font-size:17px;width:16px}
  details[open] summary:before{content:"−"}
  details .dbody{padding:0 14px 14px 39px}
  .map{font-size:13px}
  .map .m-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .map .m-legend span{font-size:11px;color:#374151;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
  .map .m-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .map .m-panel{background:#FAFAFC;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .map .m-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;letter-spacing:.3px}
  .map .m-flow{display:flex;align-items:stretch;overflow-x:auto}
  .map .m-zone{flex:1;min-width:130px;display:flex;flex-direction:column}
  .map .m-zh{color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:8px 4px;border-radius:8px 8px 0 0}
  .map .m-zb{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:10px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
  .map .m-node{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:8px 9px;font-size:12px;white-space:pre-line}
  .map .m-chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:4px}
  .map .m-arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center}
  .map .m-arrow:before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #9CA3AF}
  .map .zp{background:var(--purple)} .map .np{border-left-color:var(--purple)} .map .cp{background:var(--purple-soft);color:var(--purple)}
  .map .zb{background:var(--blue)} .map .nb{border-left-color:var(--blue)} .map .cb{background:var(--blue-soft);color:var(--blue)}
  .map .zt{background:var(--teal)} .map .nt{border-left-color:var(--teal)} .map .ct{background:var(--teal-soft);color:var(--teal)}
  .map .za{background:var(--amber)} .map .na{border-left-color:var(--amber)} .map .ca{background:var(--amber-soft);color:var(--amber)}
  .map .zr{background:var(--rose)}
  .map .m-fb{background:var(--rose-soft);border:1px dashed var(--rose);border-radius:11px;padding:13px}
  .map .m-fb-t{font-size:12px;font-weight:700;color:var(--rose);margin-bottom:10px}
  .map .m-fb-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .map .m-fb-node{background:#fff;border:1px solid var(--rose);color:#9F1239;border-radius:7px;padding:6px 10px;font-size:12px}
  .map .m-back{margin-top:9px;font-size:11.5px;color:#9F1239;font-weight:700}
  .map .m-metrics{background:var(--blue-soft);border:1px dashed var(--blue);border-radius:11px;padding:13px}
  .map .m-grid{display:flex;flex-wrap:wrap;gap:8px}
  .map .m-item{background:#fff;border:1px solid var(--blue);border-radius:8px;padding:8px 10px;font-size:11.5px;flex:1 1 140px}
  .map .m-item .m-layer{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:4px}
  .map .le{background:#EDE4FF;color:var(--purple)} .map .lx{background:#CCFBF1;color:var(--teal)} .map .lb{background:#FEF3C7;color:var(--amber)}
  .map .m-item .m-n{font-weight:700;display:block} .map .m-item .m-p{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:34px 20px 40px}
  @media(max-width:820px){
    .hero{padding:38px 0 32px} .hero h1{font-size:26px}
    section{padding-top:30px} .sec-head h2{font-size:18px}
    .card{padding:16px} .kv{grid-template-columns:100px 1fr}
    .map .m-flow{flex-direction:column}
    .map .m-arrow{height:20px;flex:0 0 20px}
    .map .m-arrow:before{border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #9CA3AF;border-bottom:0}
    .map .m-zb{flex-direction:row;flex-wrap:wrap} .map .m-node{flex:1 1 130px}
    .demo-cta{font-size:13px;padding:11px 16px} .demo-cta span{display:none}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="kicker" id="kicker">AI 产品经理作品集</span>

    <div class="legend">
      <span>证据标注</span>

  </div>
</header>

<nav><div class="wrap" id="nav"></div></nav>

<main class="wrap">
  <section id="s1"><div class="sec-head"><div class="sec-no">1</div><div><h2>项目概览</h2><div class="en">Overview &amp; Self-check</div></div></div><div id="b1"></div></section>
  <section id="s2"><div class="sec-head"><div class="sec-no">2</div><div><h2>作品设计文档</h2><div class="en">Design Doc</div></div></div><div id="b2"></div></section>
  <section id="s3"><div class="sec-head"><div class="sec-no">3</div><div><h2>可审阅 PRD</h2><div class="en">PRD</div></div></div><div id="b3"></div></section>
  <section id="s4"><div class="sec-head"><div class="sec-no">4</div><div><h2>综合方案图</h2><div class="en">Solution Map</div></div></div><div class="card map" id="map"></div></section>
  <section id="s5"><div class="sec-head"><div class="sec-no">5</div><div><h2>评测方案</h2><div class="en">Evaluation</div></div></div><div id="b5"></div></section>
</main>

<footer>AI 产品经理作品集 · 单文件页面，可离线打开 · 证据分级：真实 / 仿真 / 估算 / 假设</footer>

<script>
const CONFIG = {
  kicker: "AI 产品经理作品集 · V1.0",
  title: "车易停 · 全场景智慧停车平台",
  subtitle: "面向车主 / 车场运营 / 城市监管的 ETC 无感支付 SaaS，用工作流固化通行链路，用 Agent 处理异常与动态调度。核心指标：车位查询成功率 ≥95%、抬杆响应 ≤1 秒、通行效率提升 ≥60%。",
  nav: [
    {id:"s1", label:"项目概览"}, {id:"s2", label:"设计文档"}, {id:"s3", label:"PRD"},
    {id:"s4", label:"方案图"}, {id:"s5", label:"评测方案"}
  ],
  b1: [
    {type:"p", text:"项目基线：已有完整 PRD V1.0（8 章，覆盖 C 端车主 / B 端车场 / IoT 设备 / G 端监管）与可点击 Demo（四端 SPA，移动端已适配）。本次精修定位为「增量补全」——保留原有范围与指标，补齐 AI 选型、评测与 bad case 闭环，不做推翻重做。"},
    {type:"score", items:[
      {q:"Q1 问题定义", score:"2/2", gap:"四类用户与场景清晰，痛点可计量；数字来源为行业公开数据，标 [估算]，尚无自有埋点 [假设]"},
      {q:"Q2 指标体系", score:"1/2", gap:"PRD 已给 7 项目标值与口径说明；缺分母定义、坏例判定与采集方式；停车转化率、次月留存率目标值空缺"},
      {q:"Q3 评测方案", score:"0/2", gap:"原 PRD 无评测集、无通过线、无回归机制——本次从零补齐"},
      {q:"Q4 bad case", score:"1/2", gap:"第 5 章列了识别/支付/设备三类异常与兜底，但无分类分级、归因与回归入库；本次升级为迭代闭环"}
    ]},
    {type:"h", text:"现有资产盘点"},
    {type:"table", head:["项","判定","依据与处理方式"], rows:[
      ["目标用户与场景","已有","PRD §2.1 四类角色画像（C 端车主 / B 端运营 / G 端监管 / IoT 厂商）→ 保留，补充经验水平、使用频率与决策权"],
      ["痛点","已有但缺证据分级","PRD §2.2 五类痛点含行业数字（15 分钟寻位 / 30% 拥堵 / 15% 计费争议）→ 标 [估算]，说明来源为行业公开数据，非自有埋点"],
      ["方案与功能","已有","PRD §4 七大场景 + Demo 四端交互 → 保留，补 MVP 边界与「不做什么」"],
      ["技术选型","薄弱","PRD 只列 AI 能力清单（车牌识别 / 车位检测 / 动态定价 / 数字孪生），未回答选型理由与否决 → 本次用工作流 + Agent 主线补齐"],
      ["指标体系","薄弱","§1.3 有 7 项目标值；2 项待确认 → 补分母、采集方式、坏例判定，三层分类"],
      ["评测与 bad case","缺失","无评测集 / 通过线 / 回归 / 迭代记录 → 本次作为一等交付物补齐"]
    ]},
    {type:"h", text:"补全路线图（按投入产出比排序）"},
    {type:"p", text:"1. 先补 Q1 问题定义证据分级与 Q2 指标口径（成本最低、面试最常问）→ 2. 把已有异常场景升级为 Q4 bad case 分类分级与迭代闭环 → 3. 最后从零构建 Q3 评测方案（评测集 / 三档通过线 / 四类回归）→ 4. 同步补 AI 技术选型、PRD 特有章节与综合方案图，并做图文一致性自检。"},
    {type:"callout", tone:"warn", text:"诚实声明：本项目 PRD 与 Demo 中全部效果数字均为行业基准推算 [估算]、目标值 [假设] 或 Demo 样例集 [仿真]，没有任何生产日志 [真实]。面试时必须明确说明这一点，不得当作线上结果陈述。"}
  ],
  b2: [
    {type:"h", text:"1. 背景与痛点"},
    {type:"p", text:"【谁】C 端通勤车主与商圈消费者，【什么场景】在商圈或写字楼到达停车场入口时，【什么任务】要在 3 分钟内完成找位与入场，【旧流程】开车绕场找空位、在人工车道停车取卡、出场排队缴费，【可观察失败】平均找位超过 15 分钟、人工车道单车通行 20–30 秒、高峰出口排队超 10 辆，【根因】车场数据独立形成孤岛（无实时空位诱导）、人工计费与支付通道割裂、异常处置依赖现场人员判断。[估算]（行业公开数据，PRD §2.2）"},
    {type:"p", text:"第二个可归因痛点：B 端运维人员在摄像头凌晨离线后，平均需 4 小时人工巡检才发现；因设备无统一心跳监测与自动告警链路，人工巡检占车场运营成本 20% 以上。[估算]（行业公开数据，PRD §2.2）失败场景具象化：入口摄像头离线 → 车牌无法识别 → 车辆滞留出口 → 后车拥堵 → 车主投诉计费争议。"},

    {type:"table", head:["角色","类型","经验水平","使用频率","决策权","触发场景"], rows:[

      ["G 端监管人员","次用户","高（专业监管）","每日","决定费率备案审核与信用评级","看全城热力图、复核超费率订单、处理投诉工单"]
    ]},
    {type:"p", text:"主路径（贯穿 PRD 核心流程与方案图主干）：车主查位 → 预约（可选）→ 车牌识别入场 → 系统校验预约 / 支付 / 黑名单 → 抬杆放行 → 离场识别 → 自动计费 → ETC / 微信扣费 → 抬杆 → 电子账单。异常时走降级与人工确认回路。"},
    {type:"h", text:"3. 方案与 MVP 边界"},
    {type:"p", text:"产品形态：移动端优先的四端一体化 Web Demo（C 端小程序式交互 + B 端 SaaS 后台 + G 端监管大屏），真实系统对应微信小程序 / 原生 App + SaaS 后端 + IoT 设备网关。Demo 用本地模拟数据驱动全部交互，不接生产系统。"},
    {type:"p", text:"核心功能（输入 → 处理 → 输出）：① 车位查询：定位 + 筛选 → 实时空位聚合（≤30s 延迟）→ 车场卡片 + 导航；② 在线预约：车场 + 30 分钟时段 → 余量校验 + 保证金规则 → 二维码凭证 + 到场自动识别；③ 无感通行：车牌图像 → 识别 + 预约/支付/黑名单校验 → 抬杆 + 入场通知；④ 智能寻车：车位检测器数据 → 室内地图定位 + 路径规划 → 步行导航；⑤ 动态定价与调度：利用率 + 时段 + 竞品价 → 定价策略 + 周边诱导 → 费率建议 + 备选车场。"},
    {type:"p", text:"MVP 明确不做：不接真实 ETC 清算与微信支付商户号（PRD §8.1 外部依赖未闭环）；不接真实道闸 / 摄像头硬件，远程开闸为模拟指令；不做 1:1 三维数字孪生建模（PRD §4.7.1 列为第四阶段）；不做原生 App 双端发布；不实现跨城市数据开放接口与商户分账结算；不做欠费法律追缴（PRD §8.2 待法务审核）。"},
    {type:"h", text:"4. 技术选型（RAG / Agent / 工作流 / MCP）"},
    {type:"cards", color:"purple", items:[
      {tag:"主选型", title:"工作流 Workflow · 核心通行链路", body:"负责：车牌识别结果 → 校验 → 计费 → 支付 → 抬杆 → 账单的固定步骤编排。选它：步骤固定可枚举、强合规、每步需审计与异常回流（PRD §4.1.3 / §6.3）。否决 Agent 做主链路：抬杆响应要求 ≤1 秒，Agent 自主规划引入不可控路径与延迟波动。边界：当场景切换为多车场大型活动协同调度（路径不固定）时失效，交由 Agent 处理。"},
      {tag:"辅助选型", title:"Agent · 异常处置与动态调度", body:"负责：识别失败降级、满位周边诱导、欠费追缴决策、动态定价建议四类非固定路径任务。选它：路径每次不同、需组合调用订单 / 设备 / 周边车场 / 定价多个内部工具。否决工作流做调度：分支组合爆炸，配置成本高且难维护。边界：政策类问题（各城市路侧准入资质，PRD §8.2）依赖非结构化文档，当前无知识检索能力，标 [假设] 后续补 RAG。"},
      {tag:"否决项", title:"RAG · 暂不采用", body:"否决理由：本项目的决策依据是实时结构化数据（车位数、订单状态、设备心跳），不是需要溯源的非结构化知识文档；引入知识库会新增切片、更新、召回评测的维护成本，与 ≤2 秒列表加载目标冲突。重新评估触发条件：当接入城市停车政策问答或投诉判例检索时再引入。"},
      {tag:"否决项", title:"MCP · 暂不采用", body:"否决理由：设备接入是固定协议适配（GB/T 28181、ETC 行业标准、LoRa/NB-IoT、HTTP API，PRD §4.3），属于一次性对接，而非多第三方工具动态发现与复用。用标准协议适配层 + 状态上报即可。重新评估触发条件：当平台需要开放给第三方开发者动态接入工具生态时再引入。"}
    ]},
    {type:"p", text:"决策树走查：Q1 答案是否必须来自私有 / 常更新知识？否（实时结构化数据为主）→ Q2 步骤是否固定可枚举？核心通行链路是 → 选工作流；异常与调度否 → 选 Agent；Q3 是否需自主调用多个外部工具？仅内部系统 → 不上 MCP。"},
    {type:"h", text:"5. 指标体系（效果 / 体验 / 业务）"},
    {type:"table", head:["指标","层","定义","口径（分子/分母/范围）","目标值","采集方式","坏例判定"], rows:[
      ["车位查询成功率","效果","查询后 10 秒内返回有效空位的比例","分子=返回有效空位的请求数；分母=全部车位查询请求；范围=C 端小程序","≥95% [估算]（PRD §1.3）","日志埋点","返回空位但到场无位，或车场无数据却显示虚构空位"],
      ["车牌识别准确率","效果","出入口识别车牌与实车一致的比例","分子=识别正确次数；分母=全部识别触发次数；范围=封闭车场 + 路侧","≥99.5% 封闭 / ≥98% 路侧 [估算]（PRD §4.1.3 / §4.5.1）","设备日志 + 人工抽检","错一位字符、误识别为预约车牌、无牌车未转人工"],
      ["机器人接管率 / 人工接管率","业务","需人工介入的通行事件占比","分子=转人工扫码 / 人工登记 / 人工复核事件数；分母=全部通行事件数","≤2% [假设]","工单日志","同一事件重复转人工，或高风险事件未转人工"],
      ["端到端抬杆响应","体验","从识别成功到道闸抬杆的耗时 P95","统计范围=全部成功识别事件；取 P95 而非均值","≤1 秒 [估算]（PRD §4.1.3）","设备链路 trace","P95 > 1 秒，或单次 > 2 秒"],
      ["无感支付时长","体验","从离场识别到扣费完成的耗时 P95","分子=扣费完成时间 − 离场识别时间；分母=全部 ETC 支付事件","≤3 秒 [估算]（PRD §1.3）","支付链路日志","ETC 余额不足未降级微信，或扣费失败未先抬杆"],
      ["通行效率提升","业务","改造后单车通行时间相对改造前的下降比例","(改造前平均 − 改造后平均) / 改造前平均；范围=试点车场出入口","+60% [估算]（PRD §1.3）","出入口视频统计","改造后反而变慢，或仅单车道改善"],
      ["缴费成功率","业务","已生成订单中成功完成支付的比例","分子=成功支付订单数；分母=已生成订单数（含欠费）","≥99% [估算]（PRD §1.3）","订单库","重复扣费未自动检测，或 7 天欠费未纳黑名单（需法务确认，标 [假设]）"]
    ]},
    {type:"h", text:"6. 价值与边界"},
    {type:"kv", items:[
      {k:"增量价值", v:"旧方案：人工车道单车通行 20–30 秒、寻位 15 分钟以上 [估算]；本方案：识别到抬杆 ≤1 秒、无感支付 ≤3 秒 [估算]，PRD 目标通行效率 +60% [估算]。核心增量是把「找位—入场—缴费—寻车」从四个割裂动作变成一条可观测、可审计的链路。"},
      {k:"适用边界", v:"适合已有 ETC 用户基础、设备可标准化接入的封闭车场与路侧泊位；不适合无牌车占比高、网络长期不可用、室内地图未采集的车场（寻车功能需第三方采集，PRD §8.1）；不适合需要现场责任判定的事故场景。"},
      {k:"风险与责任", v:"高风险节点必须人工确认：超备案费率 20% 的订单（PRD §4.4.2）、套牌 / 车牌不符（§5.1）、无牌车出场核对、欠费黑名单纳入（§8.2 法务待审）。车牌与支付信息加密存储、后台操作日志全记录（§6.3）。AI 不自动执行法务追缴，不自动修改已备案费率。"}
    ]}

  b3: [
    {type:"p", text:"以下七章是在原 PRD V1.0 八章基础上补齐的 AI 产品特有章节。产品逻辑、核心流程、AI 组件、人工确认、异常兜底五类内容均在正文落位，并与「综合方案图」板块图文一致。原 PRD 的 §4 场景、§5 异常、§6 非功能要求保持不变。"},
    {type:"details", title:"1. 模型选型与理由", open:true, blocks:[
      {type:"p", text:"选型：核心通行链路用工作流（固定步骤编排），异常处置与动态调度用 Agent；不采用通用大模型直接做通行决策。理由：通行是低延迟、强合规、步骤可枚举的执行链路，Agent 的自主规划会破坏 ≤1 秒抬杆约束 [估算]。"},
      {type:"p", text:"视觉层：车牌识别采用专用视觉模型（非通用多模态大模型），因 PRD §6.1 要求识别响应 ≤300ms，通用大模型无法满足延迟目标 [估算]；污损 / 逆光 / 夜间场景由专用模型 + 人工扫码兜底（PRD §5.1）。路侧车位检测用 AI 视觉替代地磁以降部署成本，验收准确率 ≥95% [估算]。"},
      {type:"p", text:"被否决方案：① 通用大模型端到端决策——延迟不可控、无可审计步骤；② RAG 做费率问答——当前决策依赖实时结构化费率表，知识库维护成本大于收益；③ 纯规则引擎做调度——无法处理满位诱导与错峰共享的组合分支。[假设] 拿到真实车场日志后，若异常事件占比 <0.5%，Agent 可简化为规则 + 少量模型调用。"}
    ]},
    {type:"details", title:"2. Prompt / 知识库策略", blocks:[
      {type:"p", text:"Agent 异常处置的 Prompt 采用固定结构：角色=车场运行调度员；输入=结构化事件 JSON（事件类型 / 车牌 / 车场 / 时间 / 设备状态 / 订单状态）；约束=仅在给定工具列表内选择动作，输出必须是 {action, params, needHuman, reason} 结构化对象，禁止自由发挥；few-shot=每类异常 2 个示例（识别失败、满位诱导）；防注入=输入字段做白名单校验，车牌仅允许字母数字与中文省份简称。"},
      {type:"p", text:"知识库策略：首版不建向量库，费率表 / 备案状态 / 设备协议版本存结构化数据库，按车场 ID + 生效时间查询，保证可溯源与时效性。知识更新责任人=B 端运营经理（费率备案）与设备运维（协议版本），更新后需复核生效时间。[假设] 二期若要接入城市政策问答，再引入 RAG，文档来源仅限政府公开文件并标注版本。"},
      {type:"p", text:"密钥与敏感数据：ETC 商户号、支付密钥、设备接入凭证使用占位符 <ETC_MERCHANT_ID> / <PAY_SECRET> / <DEVICE_TOKEN>，不写入 PRD、Demo 或本作品集；车牌与支付信息加密存储（PRD §6.3）。"}
    ]},
    {type:"details", title:"3. 评测指标与失败兜底", blocks:[
      {type:"p", text:"效果指标：车位查询成功率 ≥95%、车牌识别准确率 ≥99.5%（封闭）/≥98%（路侧）[估算]；体验指标：抬杆响应 P95 ≤1 秒、无感支付 P95 ≤3 秒 [估算]；业务指标：缴费成功率 ≥99% [估算]、人工接管率 ≤2% [假设]。三处一致：板块 2 指标体系、本章、板块 5 评测定义表。"},
      {type:"p", text:"bad case 分类与兜底：识别失败 / 误识别 → 人工扫码入场 + 标记异常订单；支付失败 / ETC 余额不足 → 自动降级微信 + 先抬杆后补付（PRD §5.2）；设备离线 → 心跳 5 分钟告警 + 本地缓存补传 + 人工登记模式（§5.3）；超备案费率 → 冻结自动扣费 + 人工复核；查询无数据 → 显示「数据待更新」，禁止虚构空位（§4.1.1）。完整迭代闭环见板块 5。"}
    ]},
    {type:"details", title:"4. 人工确认节点", blocks:[
      {type:"p", text:"四类必须人工确认的高风险节点：① 超备案费率 20% 的订单——G 端监管人员复核，有权退回车场修正；② 车牌与预约车牌不符 / 套牌嫌疑——入口岗人工确认，不自动放行；③ 无牌车辆出场——人工核对或按最短时长计费；④ 欠费超 7 天纳入黑名单——需法务确认（PRD §8.2 开放问题）。"},
      {type:"p", text:"决策权与超时：运营专员可处理订单与设备类复核，财务人员独占退费与对账，超备案费率需 G 端监管确认（PRD §4.2.1 权限表）。人工节点超时 15 分钟未处理 → 升级至上一角色；复核不通过 → 回流至异常处置 Agent 重新选择动作，并记录 bad case 入库。"}
    ]},
    {type:"details", title:"5. 成本与延迟", blocks:[
      {type:"p", text:"延迟预算（端到端抬杆 ≤1 秒）：车牌识别 ≤300ms [估算，PRD §6.1] + 校验 / 计费查询 ≤200ms [估算] + 抬杆指令 ≤300ms [估算]，预留 200ms 抖动。支付 ≤3 秒预算中，ETC 扣费走同步通道，微信降级为异步 + 先抬杆。"},
      {type:"p", text:"成本权衡：[假设] 专用视觉模型单次推理成本显著低于通用多模态大模型，故识别环节不用大模型；Agent 仅在异常事件触发时调用（目标 <2% 通行事件），避免常态成本；费率表与设备状态走缓存查询，不重复调用模型。首版无真实调用量，所有成本区间需试点车场跑 2 周后回填 [假设]。"}
    ]},
    {type:"details", title:"6. 数据飞轮", blocks:[
      {type:"p", text:"闭环路径：车主申诉 / 运营标记异常 → bad case 分类分级 → 归因（识别 / 规则 / Prompt / 设备 / 数据）→ 修复 → 复测 → 入黄金回归集 → 下一版本防退化。G 端投诉工单（PRD §4.4.2）与 B 端异常订单（§4.2.3）是主要 bad case 来源。"},
      {type:"p", text:"冷启动：首版 [仿真] 评测集 120 条（正常 60 / 边界 28 / 对抗 16 / 失败 16），由 PRD 第 5 章异常场景、接口协议边界与人工构造生成，覆盖四类维度。试点上线后按每周真实事件回流，目标 4 周扩充至 500 条 [假设]；标注由产品本人完成，20% 抽样由同行复核。"}
    ]},
    {type:"details", title:"7. 边界与责任", blocks:[
      {type:"p", text:"AI 不做：不自动修改备案费率、不自动执行欠费法律追缴、不在车牌存疑时自动放行、不在设备离线时虚构车位数据、不自动开放跨城市数据接口。[估算/假设] 对应 PRD §4.1.1 验收标准、§5.1 识别异常、§8.2 开放问题。"},
      {type:"p", text:"合规：车牌与支付信息加密存储，符合个人信息保护法（PRD §6.3）；运营后台操作日志全记录支持审计；支付链路需通过金融级安全认证；费率备案需 G 端审核后上线。责任划分：误放行与错计费由车场运营方 + 平台共同承担，需以操作日志与出入场照片为判定依据。[假设，待法务确认]"}
    ]}
  ],

const evMap = {"[真实]":"ev-real","[仿真]":"ev-sim","[估算]":"ev-est","[假设]":"ev-hyp"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(text){
  let s = esc(text);
  s = s.replace(/\[(真实|仿真|估算|假设)\]/g, m => '<span class="ev '+evMap[m]+'">'+m+'</span>');
  return s.replace(/\n/g,"<br>");
}
function renderBlocks(blocks){
  return blocks.map(b => {
    switch(b.type){
      case "h": return '<div class="h3">'+fmt(b.text)+'</div>';
      case "p": return '<p class="p">'+fmt(b.text)+'</p>';
      case "table":
        return '<div class="tbl-wrap"><table><thead><tr>'+b.head.map(h=>'<th>'+fmt(h)+'</th>').join("")+
          '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join("")+'</tr>').join("")+
          '</tbody></table></div>';
      case "cards":
        return '<div class="cards">'+b.items.map(it=>
          '<div class="mini '+(b.color||"blue")+'">'+(it.tag?'<span class="tag">'+fmt(it.tag)+'</span>':"")+
          '<div class="t">'+fmt(it.title)+'</div><div class="b">'+fmt(it.body)+'</div></div>').join("")+'</div>';
      case "kv":
        return '<div class="kv">'+b.items.map(it=>'<div class="k">'+fmt(it.k)+'</div><div class="v">'+fmt(it.v)+'</div>').join("")+'</div>';
      case "callout":
        return '<div class="callout '+(b.tone==="warn"?"warn":"")+'">'+fmt(b.text)+'</div>';
      case "score":
        return '<div class="score-strip">'+b.items.map(it=>
          '<div class="score"><div class="q">'+fmt(it.q)+'</div><div class="v">'+fmt(it.score)+'</div>'+
          '<div class="g">'+fmt(it.gap)+'</div></div>').join("")+'</div>';
      case "details":
        return '<details '+(b.open?"open":"")+'><summary>'+fmt(b.title)+'</summary><div class="dbody">'+
          renderBlocks(b.blocks||[])+'</div></details>';
      default: return "";
    }
  }).join("");
}
